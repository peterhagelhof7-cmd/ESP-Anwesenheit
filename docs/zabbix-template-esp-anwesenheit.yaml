zabbix_export:
  version: '6.4'
  template_groups:
    - uuid: 249de150d681473a9c9b05ead04c0485
      name: 'IoT Anwesenheit'
  templates:
    - uuid: 5e55c606d85041ac8a4d9b5bc56cb48f
      template: 'ESP-Anwesenheit WT32-ETH01'
      name: 'ESP-Anwesenheit (WT32-ETH01)'
      description: |
        Template fuer das ESP-Anwesenheit-Projekt (WT32-ETH01, Windows-Login-
        Monitor). Fragt alle Werte per SNMP v1/v2c ab (das Geraet antwortet in
        der Version der Anfrage, siehe docs/entscheidungen.md).

        presence.loggedin ist die Kernmetrik: Anzahl Rechner mit aktiver
        Benutzersitzung (Lokal/RDP/Gesperrt zaehlen dazu, nur die Loginmaske
        nicht) - ein Gauge32-Wert, der steigt und faellt, kein monoton
        steigender Zaehler.

        Vor dem Einsatz:
        1. Dieses Template importieren
        2. Neuen Host anlegen, dieses Template zuweisen
        3. SNMP-Interface des Hosts auf die Board-IP setzen, Port 161
        4. Host-Makro {$SNMP_COMMUNITY} anpassen, falls die Community auf
           der Einstellungsseite des Geraets von "public" abweicht
      groups:
        - name: 'IoT Anwesenheit'
      macros:
        - macro: '{$SNMP_COMMUNITY}'
          value: public
          description: 'SNMP Community (muss mit der Einstellungsseite des Geraets uebereinstimmen)'
        - macro: '{$HEAP_MIN_BYTES}'
          value: '20000'
          description: 'Schwellwert fuer Warnung bei niedrigem freien Heap'
        - macro: '{$LOGGEDIN_MAX}'
          value: '50'
          description: 'Optionaler Schwellwert fuer "ungewoehnlich viele gleichzeitig angemeldete Benutzer" - je nach Standort anpassen oder den zugehoerigen Trigger deaktivieren'
      items:
        - uuid: 972b5f15c05b452aac1bb05f3591eefa
          name: 'System: Name'
          type: SNMP_AGENT
          snmp_oid: '.1.3.6.1.4.1.99999.1.1.0'
          key: 'system.name'
          delay: 1h
          value_type: CHAR
          tags:
            - tag: component
              value: system
        - uuid: 19e13508404e4553854a056c91106010
          name: 'System: Firmwareversion'
          type: SNMP_AGENT
          snmp_oid: '.1.3.6.1.4.1.99999.1.2.0'
          key: 'system.firmware'
          delay: 1h
          value_type: CHAR
          tags:
            - tag: component
              value: system
        - uuid: 99d70b57e1ec4de392ca5ec694de9992
          name: 'System: Systemtyp'
          type: SNMP_AGENT
          snmp_oid: '.1.3.6.1.4.1.99999.1.3.0'
          key: 'system.type'
          delay: 1h
          value_type: CHAR
          tags:
            - tag: component
              value: system
        - uuid: f722c5242d86454d9c2022f0ae68658a
          name: 'Netzwerk: LAN-IP'
          type: SNMP_AGENT
          snmp_oid: '.1.3.6.1.4.1.99999.2.1.0'
          key: 'network.lanip'
          delay: 5m
          value_type: CHAR
          tags:
            - tag: component
              value: network
        - uuid: 83c4b4a9b1b74804be6d5c532a11043e
          name: 'Netzwerk: WLAN-IP'
          type: SNMP_AGENT
          snmp_oid: '.1.3.6.1.4.1.99999.2.2.0'
          key: 'network.wlanip'
          delay: 5m
          value_type: CHAR
          tags:
            - tag: component
              value: network
        - uuid: a9c17f56c6a845bfae8033835cbe387f
          name: 'Netzwerk: WLAN-Signalstaerke'
          type: SNMP_AGENT
          snmp_oid: '.1.3.6.1.4.1.99999.2.3.0'
          key: 'network.wlanrssi'
          delay: 5m
          value_type: FLOAT
          units: dBm
          tags:
            - tag: component
              value: network
        - uuid: 31927c4bf71043f7b30c53308e7795a3
          name: 'Netzwerk: WLAN-SSID'
          type: SNMP_AGENT
          snmp_oid: '.1.3.6.1.4.1.99999.2.4.0'
          key: 'network.wlanssid'
          delay: 5m
          value_type: CHAR
          tags:
            - tag: component
              value: network
        - uuid: a37b878b3a1b42d6921d063ba080d706
          name: 'Anwesenheit: Angemeldete Benutzer'
          type: SNMP_AGENT
          snmp_oid: '.1.3.6.1.4.1.99999.3.1.0'
          key: 'presence.loggedin'
          delay: 1m
          value_type: UNSIGNED
          description: 'Anzahl Rechner mit aktiver Sitzung (Lokal/RDP/Gesperrt) - Gauge32, kein Zaehler.'
          tags:
            - tag: component
              value: presence
        - uuid: 8d0decd96d6f4108970ffdb9528fbbb3
          name: 'Status: Uptime'
          type: SNMP_AGENT
          snmp_oid: '.1.3.6.1.4.1.99999.5.1.0'
          key: 'status.uptime'
          delay: 5m
          value_type: TEXT
          description: 'SNMP-TimeTicks (Zentisekunden), Zabbix zeigt sie als formatierte Zeitspanne an.'
          tags:
            - tag: component
              value: status
        - uuid: e86d0101150b47bfb7d0a34093db438b
          name: 'Status: Freier Heap'
          type: SNMP_AGENT
          snmp_oid: '.1.3.6.1.4.1.99999.5.2.0'
          key: 'status.freeheap'
          delay: 5m
          value_type: UNSIGNED
          units: B
          tags:
            - tag: component
              value: status
  triggers:
    - uuid: 134b6121d51a48eaad60c79ab9806eac
      name: 'Keine SNMP-Daten von {HOST.NAME} seit 10 Minuten'
      expression: 'nodata(/ESP-Anwesenheit WT32-ETH01/presence.loggedin,10m)=1'
      priority: HIGH
    - uuid: f7b703c7846940e587cace3c6ec36730
      name: 'Freier Heap niedrig auf {HOST.NAME}'
      expression: 'last(/ESP-Anwesenheit WT32-ETH01/status.freeheap)<{$HEAP_MIN_BYTES}'
      priority: WARNING
    - uuid: 5b654eadfc2f426b92e71d01160ac366
      name: 'Ungewoehnlich viele angemeldete Benutzer auf {HOST.NAME}'
      expression: 'last(/ESP-Anwesenheit WT32-ETH01/presence.loggedin)>{$LOGGEDIN_MAX}'
      priority: WARNING
      description: 'Optionaler Kapazitaets-/Plausibilitaetsalarm - Schwellwert per {$LOGGEDIN_MAX} anpassen oder Trigger deaktivieren, falls nicht gewuenscht.'
