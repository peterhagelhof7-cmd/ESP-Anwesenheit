; ============================================================================
; ESP-Anwesenheit - Windows Login Monitor auf WT32-ETH01
; PlatformIO Projektkonfiguration
; ============================================================================

[env:wt32-eth01]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; ConfigManager verwendet zur Laufzeit LittleFS (LittleFS.begin()) - ohne
; dieses Flag baut "pio run --target uploadfs" faelschlich ein SPIFFS-Image
; (siehe sensormeter/docs/entscheidungen.md fuer den identischen Hinweis).
board_build.filesystem = littlefs

; Bewusst NICHT min_spiffs.csv wie bei sensormeter: dort war das OTA-Flash-
; Budget wegen vieler Adafruit-Sensor-Bibliotheken eng. Dieses Projekt hat
; deutlich weniger Abhaengigkeiten, aber einen groesseren Speicherbedarf fuer
; logins.csv (14 Tage Ereignis-Historie) - daher Standardpartitionierung
; (~1,31 MB je OTA-Slot, ~1,31 MB Datenpartition) statt der 128 KB, die
; min_spiffs.csv der Datenpartition zugestehen wuerde. Siehe docs/entscheidungen.md.

lib_deps =
    esp32async/ESPAsyncWebServer@^3.11.2
    esp32async/AsyncTCP@^3.4.10
    bblanchon/ArduinoJson@^7.4.3
    0neblock/SNMP_Agent@^2.1.0

build_flags =
    -D CORE_DEBUG_LEVEL=1
